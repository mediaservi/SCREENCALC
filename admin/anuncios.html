<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AVHUB · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== AVHUB ADS · motor de anuncios común (SCREENS y gestor de anuncios) ===== */
.avad{position:relative;margin:10px 0;border-radius:var(--avad-radio,10px);overflow:hidden;font-family:var(--avad-fuente,Inter,system-ui,sans-serif);font-size:13px;line-height:1.35;background:var(--avad-fondo,#fff);border:1px dashed #cbd5e1;color:#0f172a}
.avad *{box-sizing:border-box}
.avad-tag{position:absolute;top:3px;right:8px;z-index:4;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;pointer-events:none}
.avad-encima .avad-tag{color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.avad-link{display:grid;gap:10px;align-items:center;padding:18px 12px 12px;color:inherit;text-decoration:none;cursor:pointer}
.avad-media{position:relative;width:100%;max-width:calc(var(--maxh) * var(--ar));aspect-ratio:var(--ar);margin:0 auto;border-radius:6px;overflow:hidden;background:#0b0b0f}
.avad-capa{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.avad-capa.on{opacity:1}
.avad-capa img,.avad-capa video{width:100%;height:100%;display:block;pointer-events:none;object-fit:var(--fit,cover);object-position:var(--avad-foco,50% 50%)}
.avad-capa iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.avad-txt{min-width:0;font-size:var(--avad-tam,13px);font-weight:var(--avad-peso,700);color:var(--avad-color,#0f584c)}
.avad-txt ul{margin:0;padding-left:18px;list-style:disc;font-weight:var(--avad-peso,600);line-height:1.45;text-align:left}
.avad-txt .avad-t1{display:block}
.avad-btn{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:999px;background:var(--avad-btn-bg,#9900ff);color:var(--avad-btn-fg,#fff);font-weight:800;font-size:calc(var(--avad-tam,13px) * .92);letter-spacing:.03em;text-shadow:none}
.avad-link:hover .avad-btn{filter:brightness(1.15)}
.avad-link:hover .avad-txt ul,.avad-link:hover .avad-t1{text-decoration:underline}
/* posiciones del texto */
.avad-lado .avad-link{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.avad-lado.avad-vert .avad-link{grid-template-columns:minmax(0,.85fr) minmax(0,1fr)}
.avad-lado.avad-vert .avad-media{width:100%}
.avad-debajo .avad-link{grid-template-columns:1fr}
.avad-debajo .avad-txt{text-align:center}
.avad-debajo .avad-txt ul{display:inline-block}
.avad-ninguno .avad-link{grid-template-columns:1fr}
.avad-encima{border-style:solid;border-color:transparent;background:var(--avad-fondo,#0b0b0f)}
.avad-encima .avad-link{display:block;position:relative;padding:0}
.avad-encima .avad-media{border-radius:0;width:100%;max-width:calc(var(--maxh) * var(--ar))}
.avad-encima .avad-txt{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:3;font-size:var(--avad-tam,17px);font-weight:var(--avad-peso,800);max-width:72%}
.avad-encima.avad-banner .avad-txt{font-size:var(--avad-tam,14px);max-width:80%}
.avad-sinmedia .avad-txt{position:relative!important;top:auto!important;transform:none!important;padding:22px 16px 14px;max-width:100%!important;color:var(--avad-color,#0f584c)}
/* formatos fijos IAB: tamaño nativo como máximo, centrados */
.avad-fijo{max-width:var(--maxw);margin-left:auto;margin-right:auto}
.avad-fijo.avad-encima .avad-media,.avad-fijo.avad-ninguno .avad-media{max-width:100%}
/* contraste automático del texto encima de la media */
.avad-tono-oscuro{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.avad-tono-claro{color:#111!important;text-shadow:0 0 4px rgba(255,255,255,.9),0 0 2px #fff}
.avad-tono-filete{color:#fff!important;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 6px rgba(0,0,0,.8)}
.avad-zona{display:block}
.avad-zona:empty{display:none}
.avad-estrecho.avad-lado .avad-link{grid-template-columns:1fr}
.avad-estrecho.avad-lado.avad-vert .avad-media{width:100%}
.avad-estrecho .avad-txt{text-align:center}
.avad-estrecho .avad-txt ul{display:inline-block}
/* estilo de cada anuncio (editor de AVHUB ADMIN) */
.avad-al-izq .avad-txt{text-align:left!important}
.avad-al-centro .avad-txt{text-align:center!important}
.avad-al-der .avad-txt{text-align:right!important}
.avad-al-centro .avad-txt ul,.avad-al-der .avad-txt ul{display:inline-block;text-align:left}
.avad-encima.avad-al-centro .avad-txt{left:50%;right:auto;transform:translate(-50%,-50%);width:max-content;max-width:84%}
.avad-encima.avad-al-der .avad-txt{left:auto;right:16px}
.avad-conborde{border:2px solid var(--avad-borde)!important}
.avad-sombra{box-shadow:0 8px 22px rgba(0,0,0,.3)}
.avad-btn-redondeado .avad-btn{border-radius:6px}
.avad-btn-recto .avad-btn{border-radius:0}
.avad-velo .avad-media::after{content:'';position:absolute;inset:0;z-index:2;background:rgba(0,0,0,var(--avad-velo,.3));pointer-events:none}
.avad-tr-corte .avad-capa{transition:none}
.avad-tr-deslizar .avad-capa{opacity:1;transform:translateX(100%);transition:transform .7s ease}
.avad-tr-deslizar .avad-capa.on{transform:none}
.avad-tr-deslizar .avad-capa.fuera{transform:translateX(-100%)}
.avad-tr-deslizar .avad-capa.sin-tr{transition:none}
.avad-tr-zoom .avad-capa{transform:scale(1.08);transition:opacity .9s ease,transform 6s ease-out}
.avad-tr-zoom .avad-capa.on{transform:scale(1)}
.avad-hueco{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;aspect-ratio:var(--ar,1.78);min-height:110px;max-height:240px;margin:10px 0;border:2px dashed rgba(153,0,255,.45);border-radius:10px;background:repeating-linear-gradient(45deg,rgba(153,0,255,.05) 0 12px,rgba(153,0,255,.11) 12px 24px);color:#5b21b6;font:600 12px/1.3 Inter,system-ui,sans-serif;text-align:center;padding:8px}
.avad-hueco b{font:800 18px/1 Inter,system-ui,sans-serif;letter-spacing:.08em}
.avad-hueco small{font-size:11px;color:#7c3aed}
@media print{.avad,.avad-zona,.avad-hueco{display:none!important}}

/* ===== FIRMAS y NEWSLETTER ===== */
.tabs{display:inline-flex;border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:#141417}
.tabs button{border:0;background:transparent;padding:8px 14px;font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--tenue)}
.tabs button.on{background:var(--on);color:#06210a}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.caja-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:linear-gradient(#2c2c33,#26262c);border-bottom:1px solid #000}
.caja-cab h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.caja-cuerpo{padding:12px;display:flex;flex-direction:column;gap:10px}
.docs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doc{border:1px solid var(--linea);background:#141417;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px;color:var(--tenue)}
.doc.on{border-color:var(--on);color:var(--on);background:#0f1f10}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.form{display:flex;flex-direction:column;gap:10px}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.plantillas{display:flex;flex-wrap:wrap;gap:8px}
.pl{width:118px;border:1px solid var(--linea);background:#141417;border-radius:8px;padding:6px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);display:flex;flex-direction:column;gap:5px;align-items:center}
.pl svg{width:100%;height:46px}
.pl.on{border-color:var(--on);color:var(--on);background:#0f1f10}
.colores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.color{width:26px;height:26px;border-radius:50%;border:2px solid #000;padding:0;box-shadow:0 0 0 1px #555}
.color.on{box-shadow:0 0 0 2px var(--on)}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--linea);border-radius:6px;background:#141417}
.campo-img{display:flex;gap:6px;align-items:center}
.campo-img .vis{width:40px;height:40px;flex:none;border-radius:6px;background:#0b0b0f center/cover no-repeat;border:1px solid #000}
.campo-img.sobre{outline:2px dashed var(--on);outline-offset:2px;border-radius:8px}
.correo{background:#fff;color:#222;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.correo-cab{background:#f1f3f4;border-bottom:1px solid #dadce0;padding:8px 12px;font:12px Arial,sans-serif;color:#5f6368;display:flex;flex-direction:column;gap:3px}
.correo-cab b{color:#202124}
.correo-cuerpo{padding:16px;font:14px Arial,sans-serif;color:#222;overflow:auto}
.correo-cuerpo .saludo{margin:0 0 18px}
.botones{display:flex;gap:8px;flex-wrap:wrap}
.bt.on{background:var(--on);border-color:var(--on);color:#06210a}
.bt.violeta{background:var(--marca);border-color:var(--marca);color:#fff}
.nota{font-size:11px;color:var(--tenue);text-align:center;line-height:1.55}
/* newsletter */
.nl-grid{display:grid;grid-template-columns:170px minmax(0,1fr) 300px;gap:14px;align-items:start}
.paleta{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px}
.paleta button{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);background:#141417;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--txt);text-align:left;cursor:grab}
.paleta button span{width:18px;text-align:center}
.lienzo-marco{background:#3a3a42;border-radius:12px;padding:16px;display:flex;justify-content:center;overflow:auto}
.lienzo{transition:width .2s}
.blq{position:relative;outline:1px dashed transparent;cursor:pointer}
.blq:hover{outline-color:#9900ff88}
.blq.sel{outline:2px solid var(--on);z-index:1}
.blq.arrastrando{opacity:.35}
.blq-barra{position:absolute;right:4px;top:4px;display:none;gap:3px;z-index:3}
.blq:hover .blq-barra,.blq.sel .blq-barra{display:flex}
.blq-barra button{border:0;border-radius:5px;background:#2A2A2A;color:#fff;font-size:11px;padding:3px 6px;font-weight:800}
.blq-barra .asa2{cursor:grab}
.marcador2{height:4px;background:var(--on);box-shadow:0 0 8px var(--on)}
.lienzo-vacio{padding:40px 20px;text-align:center;color:#666;font:13px Arial,sans-serif;line-height:1.7;border:2px dashed #bbb;margin:16px;border-radius:10px}
.props{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 92px);overflow:auto}
.props .caja-cuerpo{gap:8px}
.envio textarea{min-height:90px}
.movil .nl-col{display:block!important;width:100%!important;box-sizing:border-box}
.movil .nl-pad{padding-left:16px!important;padding-right:16px!important}
.movil .nl-img{width:100%!important;height:auto!important}
@media (max-width:1280px){.nl-grid{grid-template-columns:150px minmax(0,1fr)}.props{grid-column:1/-1;position:relative;top:0;max-height:none}}
@media (max-width:1100px){.ed-grid{grid-template-columns:1fr}}
@media (max-width:760px){.nl-grid{grid-template-columns:1fr}.paleta{position:relative;top:0;flex-direction:row;flex-wrap:wrap}.paleta button{flex:1 1 130px}}

/* catálogo */
.catlista{display:flex;flex-direction:column;gap:4px;max-height:max(320px,calc(100vh - 340px));overflow:auto;margin-top:8px}
.catfila{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--linea);background:#141417;border-radius:7px;padding:7px 9px;color:var(--txt);font-size:12px;cursor:pointer}
.catinfo{display:flex;flex-direction:column;min-width:0}.catinfo b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.catinfo span{color:var(--tenue);font-size:11px}
.catfila i{font-style:normal;white-space:nowrap}
.catck{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);cursor:pointer}
.catck input{width:18px;height:18px;accent-color:#00ff04;cursor:pointer}
.catck.grande{flex-direction:row;gap:8px;font-size:11px;color:var(--txt);border:1px solid var(--linea);border-radius:7px;padding:6px 10px}
.catpri{display:flex;align-items:center;gap:3px}.catpri button{border:1px solid var(--linea);background:#1e1e24;border-radius:5px;font-size:10px;padding:2px 6px;color:var(--txt)}.catpri button:disabled{opacity:.3}.catpri b{font-size:11px;min-width:28px;text-align:center}
.catfila.on{border-color:var(--on);background:#0f1f10}
/* cabeceras del catálogo: filtros por columna, selección y acciones en grupo */
.catcab{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin-top:8px}
.catcab label{display:flex;flex-direction:column;gap:2px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);min-width:0}
.catcab select{width:100%;min-width:0;border:1px solid var(--linea);background:#141417;color:var(--txt);border-radius:6px;padding:6px 6px;font-size:12px}
.catcab select.puesto{border-color:var(--on);color:#00ff04}
.catgrupo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;padding:7px 9px;border:1px solid var(--linea);border-radius:7px;background:#101013;font-size:12px}
.catgrupo.hay{border-color:var(--on);background:#0f1f10}
.catgrupo .todo{display:flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;margin-right:auto}
.catgrupo input[type=checkbox],.catsel input{width:18px;height:18px;accent-color:#b56bff;cursor:pointer}
.catgrupo input[type=number]{width:58px;border:1px solid var(--linea);background:#141417;color:var(--txt);border-radius:6px;padding:5px 6px;font-size:12px}
.catgrupo button{border:1px solid var(--linea);background:#1e1e24;color:var(--txt);border-radius:6px;padding:6px 9px;font-size:11px;font-weight:800;letter-spacing:.04em;cursor:pointer}
.catgrupo button.pral{border-color:var(--on);color:#00ff04}
.catgrupo button:disabled,.catgrupo input:disabled{opacity:.35;cursor:default}
.catsel{display:flex;align-items:center}
.catfila.marcada{border-color:#b56bff}
.catfila.apagada{opacity:.5}
.revision{border:1px solid var(--ambar);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#1e1a10}
.revfila{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.revfila span{flex:1 1 220px}
.revfila code{background:#0b0b0f;padding:1px 5px;border-radius:4px}
.org{display:inline-block;font-size:9px;padding:0 4px;border-radius:3px;margin-left:4px;color:#000}
.org-hoja{background:#9aa0a6}.org-web{background:#00b4ff}.org-manual{background:var(--ambar)}
.app.sin-biblio{grid-template-columns:minmax(0,1fr)}.app.sin-biblio aside{display:none}

.catgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.catder{position:sticky;top:76px}
.tabs{flex-wrap:wrap;max-width:100%}
@media (max-width:900px){.catgrid{grid-template-columns:1fr}.catder{position:relative;top:0}}
@media (max-width:560px){.tabs button{padding:7px 9px;font-size:11px;letter-spacing:.04em}.catfila{grid-template-columns:auto auto minmax(0,1fr) auto}.catfila i{grid-column:3/-1;justify-self:start}.catlista{max-height:none}}

:root{--chasis:#2A2A2A;--fondo:#18181c;--panel:#222226;--linea:#3a3a42;--txt:#e7e7ee;--tenue:#9a9aa8;--marca:#9900ff;--on:#00ff04;--ambar:#ffb000;--azul:#00b4ff;--rojo:#ff3b5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none!important}
/* cabecera */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(#2e2e34,#232328);border-bottom:1px solid #000;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}
.marca svg{width:30px;height:24px;flex:none}
.marca small{display:block;font-size:10px;letter-spacing:.18em;color:var(--tenue);font-weight:700}
.led{flex:1 1 220px;min-width:180px;height:32px;display:flex;align-items:center;padding:0 12px;border-radius:5px;background:#0b0700;border:1px solid #000;box-shadow:inset 0 0 10px #000;font-family:'Share Tech Mono',monospace;color:var(--ambar);text-shadow:0 0 6px rgba(255,176,0,.6);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led.ok{color:var(--on);text-shadow:0 0 6px rgba(0,255,4,.6)}
.led.err{color:var(--rojo);text-shadow:0 0 6px rgba(255,59,92,.6)}
.modo{font-size:10px;font-weight:800;letter-spacing:.14em;padding:5px 8px;border-radius:4px;border:1px solid}
.modo.demo{color:var(--ambar);border-color:var(--ambar)}
.modo.vivo{color:var(--on);border-color:var(--on)}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:7px;overflow:hidden;background:#141417}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:700;font-size:12px;color:var(--tenue)}
.seg button.on{background:var(--marca);color:#fff}
.bt{border:1px solid var(--linea);background:#2c2c33;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12px}
.bt:hover{border-color:#5a5a66}
a.bt{color:var(--txt);text-decoration:none}
.bt:disabled{opacity:.4;cursor:default}
.bt.prim{background:#1e1e22;border-color:var(--linea);color:var(--tenue)}
.bt.prim.sucio{background:var(--on);border-color:var(--on);color:#06210a;box-shadow:0 0 12px rgba(0,255,4,.45)}
/* estructura */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
aside{position:sticky;top:76px;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;gap:10px}
aside h2,.zona-cab h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.ayuda{font-size:11px;color:var(--tenue);text-align:center;line-height:1.5}
.dropzona{border:2px dashed #4a4a55;border-radius:10px;padding:14px 8px;text-align:center;color:var(--tenue);font-size:12px;line-height:1.5;transition:.15s}
.dropzona.sobre,.medios.sobre{border-color:var(--on);background:rgba(0,255,4,.06);color:var(--txt)}
.fila-url{display:flex;gap:6px}
.fila-url input{flex:1;min-width:0}
input[type=text],input[type=url],input[type=email],input[type=date],input[type=number],select,textarea{background:#141417;border:1px solid var(--linea);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marca);outline-offset:0;border-color:transparent}
textarea{resize:vertical;min-height:58px;line-height:1.4}
.biblio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;padding-right:2px}
.mini{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#0b0b0f center/cover no-repeat;border:1px solid #000;cursor:grab}
.mini .tipo{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:800;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:3px;letter-spacing:.05em}
.mini .x{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:20px;padding:0;display:none}
.mini:hover .x{display:block}
.mini.arrastrando{opacity:.35}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.zona{background:var(--panel);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.zona-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;background:linear-gradient(#2c2c33,#26262c);border-bottom:1px solid #000}
.zona-cab .ubi{font-size:11px;color:var(--tenue)}
.zona-cab .rot{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:var(--tenue)}
.zona-cab .rot select{width:auto}
.zona-cab .rot input{width:62px}
.lista{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:70px}
.lista.sobre{background:rgba(153,0,255,.08)}
.vacia{border:2px dashed #3d3d47;border-radius:10px;padding:16px;text-align:center;color:var(--tenue);font-size:12px;line-height:1.6}
.marcador{height:4px;border-radius:2px;background:var(--on);box-shadow:0 0 8px var(--on)}
/* tarjeta de anuncio */
.ad{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);border:1px solid var(--linea);border-radius:10px;background:#1c1c21;overflow:hidden}
.ad.arrastrando{opacity:.35}
.ad.apagado .prev{opacity:.45}
.ed{padding:10px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.ed-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.asa{cursor:grab;font-size:18px;color:var(--tenue);padding:0 2px;user-select:none;line-height:1}
.asa:active{cursor:grabbing}
.flechas{display:inline-flex;flex-direction:column}
.flechas button{border:0;background:none;color:var(--tenue);font-size:10px;line-height:1;padding:1px 3px}
.flechas button:hover{color:var(--txt)}
.ed-top .nombre{flex:1 1 140px;min-width:120px;font-weight:700}
.chip{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid}
.chip.activo{color:var(--on);border-color:var(--on)}
.chip.programado{color:var(--azul);border-color:var(--azul)}
.chip.caducado,.chip.sin{color:var(--rojo);border-color:var(--rojo)}
.chip.desactivado{color:var(--tenue);border-color:var(--linea)}
.clics{font-size:11px;color:var(--tenue);white-space:nowrap}
/* interruptor ON/OFF inequívoco */
.sw{position:relative;display:inline-flex;align-items:center;width:62px;height:26px;border-radius:13px;border:1px solid #000;background:#3a1016;cursor:pointer;flex:none;padding:0}
.sw::before{content:'OFF';position:absolute;right:8px;font-size:10px;font-weight:800;color:#ff8d9f}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9a9aa5 60%,#5b5b66);box-shadow:0 1px 3px #000;transition:left .15s}
.sw.on{background:#0b3a10}
.sw.on::before{content:'ON';left:9px;right:auto;color:var(--on)}
.sw.on::after{left:38px}
.grupo{display:flex;flex-direction:column;gap:5px}
.etq{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.formatos{display:flex;flex-wrap:wrap;gap:6px}
.fmt{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:72px;height:66px;padding:5px 3px;border:1px solid var(--linea);border-radius:8px;background:#141417;font-size:9px;font-weight:700;color:var(--tenue);line-height:1.1;text-align:center}
.fmt i{display:block;background:#4a4a55;border-radius:2px}
.fmt.on{border-color:var(--on);color:var(--on);background:#0f1f10}
.fmt.on i{background:var(--on)}
.pos{display:flex;flex-wrap:wrap;gap:6px}
.pos button{border:1px solid var(--linea);background:#141417;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--tenue);display:flex;align-items:center;gap:6px}
.pos button svg{width:22px;height:16px}
.pos button.on{border-color:var(--on);color:var(--on);background:#0f1f10}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medios{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px dashed #3d3d47;border-radius:8px;min-height:64px;align-items:center}
.medios .mini{width:58px;height:58px;aspect-ratio:auto}
.medios .num{position:absolute;right:3px;bottom:3px;font-size:9px;font-weight:800;background:var(--marca);padding:1px 5px;border-radius:8px}
.medios .add{width:58px;height:58px;border:1px dashed #555;border-radius:6px;background:none;color:var(--tenue);font-size:22px}
.medios .pista{font-size:11px;color:var(--tenue);text-align:center;flex:1;line-height:1.5}
details.mas{border-top:1px solid var(--linea);padding-top:8px}
details.mas summary{cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
details.mas .cont{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.acciones .bt{padding:5px 9px;font-size:11px}
.bt.peligro.armado{background:var(--rojo);border-color:var(--rojo);color:#fff}
/* previo */
.prev{background:#eef0f3;border-left:1px solid var(--linea);display:flex;flex-direction:column;min-width:0}
.prev-cab{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#475569;background:#e2e5ea;border-bottom:1px solid #cfd4db}
.prev-area{position:relative;flex:1;padding:12px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.prev-escala{transform-origin:top left;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:4px 10px}
.prev-nota{margin:auto;text-align:center;font-size:12px;color:#64748b;line-height:1.6;padding:20px}
.cab-acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1180px){.ad{grid-template-columns:1fr}.prev{border-left:0;border-top:1px solid var(--linea)}}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:relative;top:0;max-height:none}.biblio{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:220px}.zona-cab .rot{margin-left:0}}
@media (max-width:520px){header{padding:8px}.app{padding:8px}.dos{grid-template-columns:1fr}.fmt{width:64px}}
/* ===== ESTUDIO DE ANUNCIOS (v1.4): página fija con herramientas, lienzo con la web real, capas, propiedades y biblioteca ===== */
html.estudio-fijo,html.estudio-fijo body{height:100%;overflow:hidden}
html.estudio-fijo body{display:flex;flex-direction:column}
html.estudio-fijo header{position:relative;flex:none}
.app.modo-estudio{display:block;flex:1 1 auto;min-height:0;padding:0}
.app.modo-estudio>aside{display:none}
.estudio{-webkit-user-select:none;user-select:none;display:grid;grid-template-columns:52px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"herr lienzo pn" "herr tira pn";height:100%;min-height:0;background:#121215}
.estudio input,.estudio textarea{-webkit-user-select:text;user-select:text}
.herr{grid-area:herr;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;background:linear-gradient(90deg,#28282e,#1f1f24);border-right:1px solid #000;overflow-y:auto;scrollbar-width:none}
.herr::-webkit-scrollbar{display:none}
.herr button{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;background:transparent;color:#b9b9c6;padding:0}
.herr button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.herr button:hover:not(:disabled){color:#fff;border-color:var(--linea);background:#2c2c33}
.herr button.on{background:var(--marca);border-color:var(--marca);color:#fff;box-shadow:0 0 10px rgba(153,0,255,.5)}
.herr button:disabled{opacity:.28;cursor:default}
.herr hr{width:26px;flex:none;border:0;border-top:1px solid var(--linea);margin:4px 0}
.lz-col{grid-area:lienzo;display:flex;flex-direction:column;min-width:0;min-height:0}
.lz-barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:#1c1c21;border-bottom:1px solid #000;font-size:12px;min-height:44px}
.lz-barra .lz-pag{padding:5px 9px;border:1px solid var(--linea);border-radius:7px;background:#141417;font-weight:700;white-space:nowrap}
.lz-barra .seg button{padding:5px 10px}
.lz-barra .ir{display:inline-flex;gap:4px}
.lz-barra .ir .bt{padding:5px 9px;font-family:'Share Tech Mono',monospace;font-size:12px}
.lz-barra .bt.on{background:var(--on);border-color:var(--on);color:#06210a}
.lz-barra .nota{font-size:11px;color:var(--ambar);text-align:left}
.lz-barra .esp{flex:1 1 0}
.lz-barra .zoom{font-family:'Share Tech Mono',monospace;color:var(--ambar);min-width:48px;text-align:right}
.bt.ico{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px}
.bt.ico svg,.acciones .bt svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.lz-marco{position:relative;flex:1 1 auto;min-height:0}
.lz-vp{position:absolute;inset:0;overflow:auto;background-color:#2a2a30;background-image:linear-gradient(45deg,#25252a 25%,transparent 25%,transparent 75%,#25252a 75%),linear-gradient(45deg,#25252a 25%,transparent 25%,transparent 75%,#25252a 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.lz-tam{position:relative;margin:16px auto}
.lz-disp{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px #000}
.lz-disp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:block}
.lz-marcas{position:absolute;inset:0;pointer-events:none;z-index:2}
.lz-clip{position:absolute;overflow:hidden;pointer-events:none}
.lzm{position:absolute;border:2px dashed #9900ff;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);pointer-events:none;transition:background-color .12s}
.lzm.fija{border-color:#00b4ff}
.lzm.sel{border:2px solid var(--on);box-shadow:0 0 0 3px rgba(0,255,4,.28),inset 0 0 0 1px rgba(0,0,0,.25)}
.lzm.sobre{background:rgba(0,255,4,.18);border:3px solid var(--on)}
.lzm-et{position:absolute;left:-2px;bottom:100%;display:flex;align-items:center;gap:5px;max-width:none;padding:3px 5px 3px 7px;border-radius:6px 6px 0 0;background:#9900ff;color:#fff;font:800 11px/1 Inter,sans-serif;letter-spacing:.04em;white-space:nowrap;transform:scale(var(--inv,1));transform-origin:0 0;pointer-events:auto;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.lzm.fija .lzm-et{background:#00b4ff;color:#001826}
.lzm-et{transform-origin:0 100%}
.lzm-et.dentro{bottom:auto;top:-2px;border-radius:5px 0 8px 0;transform-origin:0 0}
.lz-marcas.compacto .lzm-et .nom{display:none}
.lzm.sel .lzm-et{background:var(--on);color:#06210a}
.lzm-et .cod{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.06em}
.lzm-et .nom{font-weight:700;letter-spacing:.02em}
.lzm-et .ch{width:24px;height:24px;flex:none;border-radius:5px;border:2px solid rgba(255,255,255,.75);background:#0b0b0f center/cover no-repeat;color:#fff;font:800 11px/20px Inter,sans-serif;text-align:center;cursor:grab;padding:0}
.lzm-et .ch.on{border-color:#fff;box-shadow:0 0 0 2px #06210a,0 0 0 4px #00ff04}
.lzm-et .ch.apagado{opacity:.45}
.lzm-et .mas{width:24px;height:24px;flex:none;border-radius:5px;border:1px dashed rgba(255,255,255,.8);background:rgba(0,0,0,.2);color:inherit;font-size:15px;line-height:1;padding:0}
.lzm-et .sw{transform:scale(.8);transform-origin:left center}
.estudio.arrastrando .lz-marcas,.estudio.arrastrando .lz-clip,.estudio.arrastrando .lzm{pointer-events:auto}
.lz-vp.mano .lz-marcas{pointer-events:auto;cursor:grab}
.lz-vp.mano.agarrando .lz-marcas{cursor:grabbing}
.lz-vp.mano .lzm-et{pointer-events:none}
.lz-borde{position:absolute;left:0;right:0;z-index:4;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 10px;pointer-events:none}
.lz-borde.arriba{top:8px}.lz-borde.abajo{bottom:10px}
.lz-borde button{pointer-events:auto;border:1px solid #000;border-radius:999px;background:#9900ff;color:#fff;font:800 11px/1 Inter,sans-serif;letter-spacing:.04em;padding:7px 12px;box-shadow:0 3px 12px rgba(0,0,0,.55)}
.lz-borde button:hover{background:#ad2bff}
.lz-aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:min(440px,calc(100% - 24px));display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border-radius:12px;background:rgba(18,18,21,.94);border:1px solid var(--linea);text-align:center;font-size:13px;line-height:1.6;color:var(--txt);box-shadow:0 10px 30px rgba(0,0,0,.6)}
/* paneles de la derecha */
.pn-col{grid-area:pn;display:flex;flex-direction:column;min-width:0;min-height:0;background:#1a1a1f;border-left:1px solid #000}
.pn-tabs{display:none;grid-area:tabs}
.pn-tira{grid-area:tira;display:flex;align-items:center;gap:12px;min-width:0;padding:8px 10px;background:#1a1a1f;border-top:1px solid #000}
.tira-et{flex:none;display:flex;flex-direction:column;gap:4px;width:118px}
.tira-et b{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.tira-et small{font-size:10px;line-height:1.4;color:var(--tenue)}
.tira-cuerpo{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px}
.tira-cuerpo .dropzona{flex:none;width:104px;height:64px;padding:6px;font-size:11px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.tira-cuerpo .dropzona small{font-size:10px}
.tira-cuerpo .fila-url{flex:0 1 240px;min-width:150px}
.tira-cuerpo .biblio{flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.tira-cuerpo .biblio .mini{flex:none;width:64px;height:64px;aspect-ratio:auto;cursor:pointer}
.tira-cuerpo .biblio .ayuda{white-space:nowrap;text-align:left}
.pn{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid #000}
.pn>h3{flex:none;margin:0;padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(#2c2c33,#25252b);border-bottom:1px solid #000;display:flex;align-items:baseline;gap:8px}
.pn>h3 small{font-size:10px;letter-spacing:.06em;text-transform:none;color:var(--tenue);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn>div{overflow-y:auto;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pn[data-p="capas"]{flex:0 1 auto;max-height:44%}
.pn[data-p="props"]{flex:1 1 auto}
/* capas */
.cp-zona{border:1px solid var(--linea);border-radius:8px;background:#202026;overflow:hidden;flex:none}
.cp-zona.sel{border-color:var(--on)}
.cp-zona.fija .cp-cab b{background:#00b4ff;color:#001826}
.cp-cab{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;min-width:0}
.cp-cab b{flex:none;min-width:30px;text-align:center;padding:3px 5px;border-radius:4px;background:#9900ff;color:#fff;font:400 12px/1 'Share Tech Mono',monospace;letter-spacing:.06em}
.cp-zona.sel .cp-cab b{background:var(--on);color:#06210a}
.cp-cab span{flex:1 1 auto;min-width:0;font-weight:700;font-size:12px;display:flex;flex-direction:column;gap:1px}
.cp-cab small{font-size:10px;font-weight:500;color:var(--tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-cab .ico{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--linea);background:#2c2c33;color:var(--txt);padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.cp-cab .ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.cp-rot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 8px 6px;font-size:11px;color:var(--tenue)}
.cp-rot select{width:auto;padding:4px 6px;font-size:11px}
.cp-rot input{width:56px;padding:4px 6px}
.cp-lista{display:flex;flex-direction:column;gap:4px;padding:0 6px 6px;min-height:8px}
.cp-lista.sobre{background:rgba(0,255,4,.07)}
.cp-vacia{font-size:11px;color:var(--tenue);text-align:center;padding:8px;border:1px dashed #3d3d47;border-radius:6px;line-height:1.4}
.cp-ad{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;border:1px solid transparent;background:#17171b;cursor:pointer;min-width:0}
.cp-ad:hover{border-color:#4a4a55}
.cp-ad.on{border-color:var(--on);background:#0f1f10}
.cp-ad.apagado .th,.cp-ad.apagado .nom{opacity:.55}
.cp-ad.arrastrando{opacity:.35}
.cp-ad .asa{font-size:12px;letter-spacing:-2px;cursor:grab}
.cp-ad .th{width:30px;height:22px;flex:none;border-radius:3px;background:#0b0b0f center/cover no-repeat;border:1px solid #000;font:800 10px/20px Inter,sans-serif;font-style:normal;text-align:center;color:#ccc}
.cp-ad .nom{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}
.cp-ad .chip{font-size:8px;padding:2px 4px;flex:none}
.cp-ad .clics{font-size:10px}
.sw.mini{width:46px;height:20px;border-radius:10px}
.sw.mini::before{font-size:8px;right:5px}
.sw.mini::after{width:14px;height:14px;top:2px;left:2px}
.sw.mini.on::before{left:6px}
.sw.mini.on::after{left:28px}
/* propiedades */
.pp-nada{font-size:12px;color:var(--tenue);text-align:center;line-height:1.6;padding:16px 6px}
.pp-nada b{color:var(--txt)}
.pp-top{display:flex;align-items:center;gap:8px}
.pp-top .pp-nombre{flex:1 1 auto;min-width:0;font-weight:700}
.pp-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px}
.pp-info .aviso{color:var(--ambar)}
.pp-campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.pp-campo>.etq{display:block}
.pp-grupo{border:1px solid var(--linea);border-radius:8px;background:#1f1f25;flex:none}
.pp-grupo>summary{cursor:pointer;padding:8px 10px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt);list-style:none;display:flex;align-items:center;gap:8px}
.pp-grupo>summary::-webkit-details-marker{display:none}
.pp-grupo>summary::before{content:'▸';color:var(--tenue);transition:transform .15s}
.pp-grupo[open]>summary::before{transform:rotate(90deg)}
.pp-cuerpo{display:flex;flex-direction:column;gap:10px;padding:2px 10px 10px}
.pp-bts{display:flex;flex-wrap:wrap;gap:5px}
.pp-bts button{flex:1 1 auto;min-width:0;border:1px solid var(--linea);background:#141417;border-radius:6px;padding:6px 8px;font-size:11px;font-weight:700;color:var(--tenue);white-space:nowrap}
.pp-bts button.on{border-color:var(--on);color:var(--on);background:#0f1f10}
.pp-bts.cinco button{flex:1 1 auto;padding:6px 5px}
.pp-bts button{min-width:max-content}
.pp-color{display:flex;align-items:center;gap:6px}
.pp-color .bt{padding:5px 9px;font-size:11px}
.pp-color .bt.on{background:var(--on);border-color:var(--on);color:#06210a}
.pp-color input[type=color]{width:44px;height:30px;cursor:pointer}
.pp-color input[type=color].apagado{opacity:.35}
.pp-desl{display:flex;align-items:center;gap:8px}
.pp-desl input[type=range]{flex:1 1 auto;min-width:0;accent-color:#9900ff}
.pp-desl .val{min-width:44px;text-align:right;font:400 12px 'Share Tech Mono',monospace;color:var(--ambar)}
.pp-desl .bt{padding:4px 8px;font-size:11px}
.pp-desl .bt.on{background:var(--on);border-color:var(--on);color:#06210a}
.pp-cuerpo .formatos{gap:5px}
.pp-cuerpo .fmt{width:auto;flex:1 1 74px;max-width:96px}
.pp-cuerpo .pos button{flex:1 1 auto}
.pp-cuerpo .medios .mini{width:54px;height:54px}
.pp-cuerpo .medios .add{width:54px;height:54px}
.pp-acc{justify-content:space-between;padding-top:4px}
.pp-acc .bt{flex:1 1 auto}

/* pantallas estrechas: herramientas arriba, lienzo y un panel cada vez (con pestañas) */
@media (max-width:860px){
  .estudio{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(200px,48%) auto minmax(0,1fr);grid-template-areas:"herr" "lienzo" "tabs" "pn"}
  .herr{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid #000;padding:4px 6px;background:linear-gradient(#28282e,#1f1f24)}
  .herr hr{width:0;height:24px;border-top:0;border-left:1px solid var(--linea);margin:0 4px}
  .pn-col{border-left:0}
  .pn-tabs{display:flex;flex:none;border-top:1px solid #000;border-bottom:1px solid #000;background:#141417}
  .pn-tira{display:none;grid-area:pn;flex-direction:column;align-items:stretch;overflow-y:auto;border-top:0;padding:10px 12px}
  .estudio.ver-biblio .pn-tira{display:flex}
  .estudio.ver-biblio .pn-col{display:none}
  .tira-et{display:none}
  .tira-cuerpo{flex-direction:column;align-items:stretch}
  .tira-cuerpo .dropzona{width:auto;height:auto;padding:12px}
  .tira-cuerpo .fila-url{flex:none}
  .tira-cuerpo .biblio{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));overflow:visible}
  .tira-cuerpo .biblio .mini{width:auto;height:auto;aspect-ratio:1}
  .pn-tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;padding:9px 4px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--tenue)}
  .pn-tabs button.on{background:var(--on);color:#06210a}
  .pn-col .pn{display:none;max-height:none!important;flex:1 1 auto}
  .pn-col .pn.on{display:flex}
  .pn>h3{display:none}
  .lz-barra{gap:6px;padding:5px 8px}
}
@media (max-width:520px){.lz-barra .etq,.lz-barra .lz-pag{display:none}.herr{gap:2px;padding:4px}.herr button{width:32px;height:32px}.herr button svg{width:19px;height:19px}.herr hr{margin:0 2px}}

    <div>AVHUB · ADMIN <span style="font-size:10px;color:var(--tenue)">v1.5</span><small>CATÁLOGO</small></div>
  </div>
  <span id="modo" class="modo"></span>

    <a class="bt" id="equipos" href="https://script.google.com/macros/s/AKfycbwkc12y4LODbFe-kQidnR2MbbA6cbW1WbhU3UiqmDmshx-ncAdGYrFRy8PNjm9Wg6Mx3w/exec?vista=equipos" target="_top" style="text-decoration:none">EQUIPOS ↗</a>
    <button class="bt prim" id="guardar">GUARDAR</button>

</header>

    <h2>Biblioteca de media</h2>

  <main id="secNews" class="sec oculto"></main>
  <main id="secCatalogo" class="sec oculto"></main>
</div>

    frames.forEach(function (f) {
      out.push(0x21, 0xF9, 4, 0); b2(f.delay); out.push(0, 0);

  /* ---------- guardar / cargar ---------- */
  function guardar(cb) {
    $$('input,textarea').forEach(function (x) { x.blur(); });
